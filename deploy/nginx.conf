worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    server {
        listen 80;
        server_name 10.22.116.88;

        # ACME challenge files must survive frontend release replacements.
        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/ais-acme/webroot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://10.22.116.88$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name 10.22.116.88;

        ssl_certificate /etc/nginx/ssl/ais-fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/ais-privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:AIS_SSL:10m;
        ssl_session_timeout 1d;

        # Public root certificate only; private CA keys are never served.
        location = /certs/ais-root-ca.crt {
            alias /etc/nginx/ssl/ais-root-ca.crt;
            default_type application/x-x509-ca-cert;
            add_header Cache-Control "no-cache" always;
        }

        # Jenkins 仅监听本机，通过现有私有 HTTPS 入口访问。
        location ^~ /jenkins/ {
            proxy_pass http://127.0.0.1:8080/jenkins/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }

        # 反代后端，保留 /api 前缀（后端真实路径为 /api/v1/...）
        location /api/ {
            proxy_pass http://10.22.116.82:18088;
            proxy_http_version 1.1;
            proxy_set_header Origin http://10.22.116.82:18088;
            proxy_set_header Host 10.22.116.82:18088;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 前端由单节点 K3s 中的 Nginx Deployment 提供。
        location / {
            proxy_pass http://127.0.0.1:30080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}
