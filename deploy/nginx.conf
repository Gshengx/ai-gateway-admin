worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /var/www/ais-gateway-admin;
        index index.html;

        # SPA history 路由：未命中的路径回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 入口文件不缓存，保证发版后立即生效
        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        # 带 hash 的静态资源长期缓存
        location ^~ /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 反代后端，保留 /api 前缀（后端真实路径为 /api/v1/...）
        location /api/ {
            proxy_pass http://10.22.116.82:18088;
            proxy_http_version 1.1;
            proxy_set_header Origin http://10.22.116.82:18088;
            proxy_set_header Host 10.22.116.82:18088;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}